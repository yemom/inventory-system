services:

  # ==========================================================
  # PostgreSQL
  # ==========================================================
  db:
    image: postgres:15-alpine
    container_name: stockflow_db
    restart: unless-stopped

    environment:
      POSTGRES_USER: ${POSTGRES_USER:-stockflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
      POSTGRES_DB: ${POSTGRES_DB:-stockflow_db}

    ports:
      - "5434:5432"

    volumes:
      - postgres_stockflow_data:/var/lib/postgresql/data

    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-stockflow} -d ${POSTGRES_DB:-stockflow_db} -q && psql -U ${POSTGRES_USER:-stockflow} -d ${POSTGRES_DB:-stockflow_db} -tAc 'SELECT 1' >/dev/null" ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s

  # ==========================================================
  # Redis (distributed rate limiting + cache)
  # ==========================================================
  redis:
    image: redis:7-alpine
    container_name: stockflow_redis
    restart: unless-stopped

    command: redis-server --requirepass ${REDIS_PASSWORD:-redispass} --maxmemory 128mb --maxmemory-policy allkeys-lru

    ports:
      - "6380:6379"

    volumes:
      - redis_stockflow_data:/data

    healthcheck:
      test: [ "CMD-SHELL", "redis-cli -a ${REDIS_PASSWORD:-redispass} ping | grep -q PONG" ]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

  # ==========================================================
  # Spring Boot Backend
  # ==========================================================
  backend:
    # Locally this is built from source; in CI/CD IMAGE_TAG pins the published
    # image to an exact commit. `image:` is ignored when only `build:` is used.
    image: ${BACKEND_IMAGE:-stockflow-backend:local}
    build:
      context: ./backend
      dockerfile: Dockerfile

    container_name: stockflow_backend
    restart: unless-stopped

    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

    environment:
      DATABASE_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-stockflow_db}
      DATABASE_USERNAME: ${POSTGRES_USER:-stockflow}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:-change-me}

      # Redis for rate limiting + cache
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-redispass}

      # Rate limiting
      RATE_LIMIT_LOGIN: ${RATE_LIMIT_LOGIN:-5}
      RATE_LIMIT_LOGIN_WINDOW: ${RATE_LIMIT_LOGIN_WINDOW:-60}
      RATE_LIMIT_API: ${RATE_LIMIT_API:-120}
      RATE_LIMIT_API_WINDOW: ${RATE_LIMIT_API_WINDOW:-60}
      RATE_LIMIT_REPORTS: ${RATE_LIMIT_REPORTS:-20}
      RATE_LIMIT_REPORTS_WINDOW: ${RATE_LIMIT_REPORTS_WINDOW:-60}

      # Cache TTLs
      CACHE_CATEGORY_TTL: ${CACHE_CATEGORY_TTL:-300}
      CACHE_WAREHOUSE_TTL: ${CACHE_WAREHOUSE_TTL:-300}
      CACHE_DASHBOARD_TTL: ${CACHE_DASHBOARD_TTL:-30}
      CACHE_PRODUCT_TTL: ${CACHE_PRODUCT_TTL:-120}

      # Connection pool
      DB_POOL_MAX: ${DB_POOL_MAX:-10}
      DB_POOL_MIN: ${DB_POOL_MIN:-2}

      # Browser origins allowed to call this API. localhost/LAN are always
      # allowed by the backend for development; add anything else here (e.g.
      # the deployed frontend origin) or the browser will block the request.
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}

      # JWT_SECRET is REQUIRED. The backend refuses to boot on the development
      # default below (StartupConfigValidator) — a signing key in the repository
      # would let anyone forge an admin token. Generate one: openssl rand -hex 32
      JWT_SECRET: ${JWT_SECRET:-change-this-jwt-secret}

      # ── Intelligence service ─────────────────────────────────────────
      # Forecasts, anomaly alerts and reorder advice, all computed from this
      # application's own transactions inside the backend. There is no
      # external provider, no API key and no outbound call, so there is
      # nothing here to keep secret and nothing to rotate.
      #
      # AI_ENABLED=false switches every /api/v1/ai endpoint off. Reports,
      # dashboards and financial figures are unaffected — they are computed
      # by the reporting layer, not by these models.
      AI_ENABLED: ${AI_ENABLED:-true}
      AI_HISTORY_DAYS: ${AI_HISTORY_DAYS:-540}
      AI_DEMAND_HISTORY_DAYS: ${AI_DEMAND_HISTORY_DAYS:-365}
      AI_CONFIDENCE: ${AI_CONFIDENCE:-0.95}
      AI_DAILY_HORIZON: ${AI_DAILY_HORIZON:-14}
      AI_MAX_DEMAND_MODELS: ${AI_MAX_DEMAND_MODELS:-25}
      AI_MIN_DEMAND_OBSERVATIONS: ${AI_MIN_DEMAND_OBSERVATIONS:-28}
      # A day is raised only when it is both statistically unusual and
      # materially different in money. See docs/intelligence.md.
      AI_ANOMALY_THRESHOLD: ${AI_ANOMALY_THRESHOLD:-3.5}
      AI_ANOMALY_MIN_OBSERVATIONS: ${AI_ANOMALY_MIN_OBSERVATIONS:-8}
      AI_ANOMALY_MIN_RELATIVE_DEVIATION: ${AI_ANOMALY_MIN_RELATIVE_DEVIATION:-0.30}
      AI_LARGE_MOVEMENT_THRESHOLD: ${AI_LARGE_MOVEMENT_THRESHOLD:-50}
      AI_SLOW_MOVING_DAYS: ${AI_SLOW_MOVING_DAYS:-60}
      AI_DEFAULT_LEAD_TIME_DAYS: ${AI_DEFAULT_LEAD_TIME_DAYS:-7}
      AI_SERVICE_LEVEL: ${AI_SERVICE_LEVEL:-0.95}
      AI_PERSIST_MODEL_VERSIONS: ${AI_PERSIST_MODEL_VERSIONS:-true}
      AI_ASSISTANT_MIN_CONFIDENCE: ${AI_ASSISTANT_MIN_CONFIDENCE:-0.35}

      REPORT_EXPORT_MAX_ROWS: ${REPORT_EXPORT_MAX_ROWS:-10000}

      # ── Chatbot service ──────────────────────────────────────────────
      CHATBOT_ENABLED: ${CHATBOT_ENABLED:-true}
      CHATBOT_PROVIDER: ${CHATBOT_PROVIDER:-deterministic}
      CHATBOT_API_URL: ${CHATBOT_API_URL:-}
      CHATBOT_API_KEY: ${CHATBOT_API_KEY:-}
      # The backend reads CHATBOT_API_KEY first and falls back to
      # OPENAI_API_KEY, so either name works. Pass both through; the key
      # itself lives in your .env, which is git-ignored.
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      CHATBOT_MODEL: ${CHATBOT_MODEL:-gpt-4o-mini}
      CHATBOT_TIMEOUT_MS: ${CHATBOT_TIMEOUT_MS:-15000}
      CHATBOT_MAX_TOKENS: ${CHATBOT_MAX_TOKENS:-900}
      CHATBOT_LLM_PHRASED: ${CHATBOT_LLM_PHRASED:-true}
      CHATBOT_MAX_CONTEXT_CHARS: ${CHATBOT_MAX_CONTEXT_CHARS:-6000}
      CHATBOT_MIN_CONFIDENCE: ${CHATBOT_MIN_CONFIDENCE:-0.45}
      CHATBOT_STAFF_RETENTION_DAYS: ${CHATBOT_STAFF_RETENTION_DAYS:-90}
      CHATBOT_CUSTOMER_RETENTION_DAYS: ${CHATBOT_CUSTOMER_RETENTION_DAYS:-30}
      CHATBOT_SESSION_TTL_HOURS: ${CHATBOT_SESSION_TTL_HOURS:-12}
      CHATBOT_MAX_MESSAGES: ${CHATBOT_MAX_MESSAGES:-100}
      CHATBOT_MESSAGES_PER_WINDOW: ${CHATBOT_MESSAGES_PER_WINDOW:-30}
      CHATBOT_WINDOW_SECONDS: ${CHATBOT_WINDOW_SECONDS:-60}

      SERVER_PORT: 8080

      MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE: health,metrics,prometheus
      MANAGEMENT_ENDPOINT_HEALTH_PROBES_ENABLED: true

      # Bootstrap administrator.
      #
      # These were previously committed here as working credentials, which
      # means the super admin of every deployment started from this file was
      # the same person with the same password. They now come from .env with
      # no default at all: an unset variable is a startup failure, which is a
      # better outcome than a reachable admin account.
      #
      # Set them in .env (see .env-example), or export them before
      # `docker compose up`.
      SUPER_ADMIN_USERNAME: ${SUPER_ADMIN_USERNAME:?SUPER_ADMIN_USERNAME is required}
      SUPER_ADMIN_EMAIL: ${SUPER_ADMIN_EMAIL:?SUPER_ADMIN_EMAIL is required}
      SUPER_ADMIN_PASSWORD: ${SUPER_ADMIN_PASSWORD:?SUPER_ADMIN_PASSWORD is required}
      SUPER_ADMIN_FIRST_NAME: ${SUPER_ADMIN_FIRST_NAME:-Super}
      SUPER_ADMIN_LAST_NAME: ${SUPER_ADMIN_LAST_NAME:-Admin}

    ports:
      - "8081:8080"

    healthcheck:
      test: [ "CMD-SHELL", "wget -q -O - http://127.0.0.1:8080/actuator/health | grep -q 'status.:.UP'" ]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s

  # ==========================================================
  # Next.js Frontend
  # ==========================================================
  frontend:
    image: ${FRONTEND_IMAGE:-stockflow-frontend:local}
    build:
      context: ./frontend
      dockerfile: Dockerfile

      args:
        NEXT_PUBLIC_API_BASE_URL: http://localhost:8081/api/v1
        NEXT_PUBLIC_APP_URL: http://localhost:3005

    container_name: stockflow_frontend
    restart: unless-stopped

    depends_on:
      backend:
        condition: service_healthy

    environment:
      NODE_ENV: production
      NEXT_PUBLIC_APP_NAME: StockFlow
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8081/api/v1
      NEXT_PUBLIC_APP_URL: http://localhost:3005
      API_INTERNAL_BASE_URL: http://backend:8080/api/v1

    ports:
      - "3005:3000"

    healthcheck:
      # Debian slim has no curl/wget preinstalled; probe with plain Node so
      # the image needs no extra packages (smaller + fewer CVEs).
      test: [ "CMD", "node", "-e", "fetch('http://127.0.0.1:3000/login').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))" ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

# ============================================================
# Persistent volumes
# ============================================================
volumes:
  postgres_stockflow_data:
    driver: local
  redis_stockflow_data:
    driver: local
