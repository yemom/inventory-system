# render.yaml — StockFlow deployment on Render.com
# Docs: https://render.com/docs/blueprint-spec
#
# Services defined here:
#   • stockflow-db       — Managed PostgreSQL 15
#   • stockflow-redis    — Managed Redis 7
#   • stockflow-backend  — Spring Boot API (Docker)
#   • stockflow-frontend — Next.js (Docker)
#
# IMPORTANT: After the first deploy, set these secret env vars manually
# in the Render dashboard (they are intentionally omitted from this file):
#   - JWT_SECRET
#   - SUPER_ADMIN_PASSWORD
#   - DATABASE_PASSWORD  (auto-linked below, but verify)
#   - REDIS_PASSWORD     (auto-linked below, but verify)
#   - CHATBOT_API_KEY or OPENAI_API_KEY  (only if the assistant's optional
#     LLM phrasing layer is switched on; see docs/chatbot.md)

databases:
  - name: stockflow-db
    databaseName: stockflow_db
    user: stockflow
    plan: free          # change to "starter" or higher for production
    region: oregon      # match your preferred region
    ipAllowList: []     # empty = allow all (Render services can always connect)
    # NOTE: Render's free PostgreSQL plan EXPIRES after 30 days. When it does,
    # the backend logs "Unable to connect to PostgreSQL at …" on the next
    # request and the service will not boot again until the database is
    # restored or a paid plan is attached. Use a paid plan for anything real.

services:
  # ── Managed Redis ─────────────────────────────────────────────────────────
  - type: redis
    name: stockflow-redis
    plan: free          # change to "starter" for persistence + higher memory
    region: oregon
    maxmemoryPolicy: allkeys-lru
    ipAllowList: []

  # ── Spring Boot Backend ───────────────────────────────────────────────────
  - type: web
    name: stockflow-backend
    runtime: docker
    region: oregon
    plan: free          # change to "starter" or higher for production
    rootDir: backend
    dockerfilePath: ./Dockerfile

    # Health check — Render waits for this before marking the deploy live.
    # The /actuator/health endpoint is already exposed via management config.
    healthCheckPath: /actuator/health

    envVars:
      # ── Server ────────────────────────────────────────────────────────────
      - key: SERVER_PORT
        value: "8080"

      # ── Database ──────────────────────────────────────────────────────────
      # Render's internal connection string is injected directly via
      # fromDatabase: connectionString (format: postgres://user:pass@host:port/db).
      # DataSourceUrlNormalizer converts it into a JDBC URL and extracts credentials.
      - key: DATABASE_URL
        fromDatabase:
          name: stockflow-db
          property: connectionString
      - key: DB_HOST
        fromDatabase:
          name: stockflow-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: stockflow-db
          property: port
      - key: DB_NAME
        fromDatabase:
          name: stockflow-db
          property: database
      - key: DATABASE_USERNAME
        fromDatabase:
          name: stockflow-db
          property: user
      - key: DATABASE_PASSWORD
        fromDatabase:
          name: stockflow-db
          property: password

      # ── Redis ─────────────────────────────────────────────────────────────
      - key: REDIS_HOST
        fromService:
          name: stockflow-redis
          type: redis
          property: host
      - key: REDIS_PORT
        fromService:
          name: stockflow-redis
          type: redis
          property: port
      - key: REDIS_PASSWORD
        fromService:
          name: stockflow-redis
          type: redis
          property: password

      # ── CORS ───────────────────────────────────────────────────────────────
      # Comma-separated browser origins allowed to call this API. WITHOUT this
      # the deployed frontend is blocked by the browser at the CORS preflight
      # (403, no Access-Control-Allow-Origin), which surfaces as an opaque
      # "Network Error" — the login looks like a dead backend.
      #
      # Must match the frontend deployment exactly, scheme included. List every
      # origin separately; do NOT use https://*.vercel.app here, because
      # allowCredentials(true) would then let any Vercel deployment make
      # authenticated calls to this API. Vercel preview deployments each get a
      # unique hostname, so add them explicitly if you need them.
      - key: CORS_ALLOWED_ORIGINS
        value: https://inventory-system-blush-mu.vercel.app

      # ── JWT (set the real value in the Render dashboard) ──────────────────
      - key: JWT_SECRET
        generateValue: true   # generates a random 256-bit hex secret on first deploy

      # ── Connection pool (conservative for free tier) ───────────────────────
      - key: DB_POOL_MAX
        value: "5"
      - key: DB_POOL_MIN
        value: "1"

      # ── Rate limiting ──────────────────────────────────────────────────────
      - key: RATE_LIMIT_ENABLED
        value: "true"
      - key: RATE_LIMIT_LOGIN
        value: "5"
      - key: RATE_LIMIT_LOGIN_WINDOW
        value: "60"
      - key: RATE_LIMIT_SIGNUP
        value: "3"
      - key: RATE_LIMIT_SIGNUP_WINDOW
        value: "3600"
      - key: RATE_LIMIT_API
        value: "120"
      - key: RATE_LIMIT_API_WINDOW
        value: "60"
      - key: RATE_LIMIT_REPORTS
        value: "20"
      - key: RATE_LIMIT_REPORTS_WINDOW
        value: "60"

      # ── Cache TTLs ────────────────────────────────────────────────────────
      - key: CACHE_CATEGORY_TTL
        value: "300"
      - key: CACHE_WAREHOUSE_TTL
        value: "300"
      - key: CACHE_DASHBOARD_TTL
        value: "30"
      - key: CACHE_PRODUCT_TTL
        value: "120"

      # ── Intelligence service ───────────────────────────────────────────────
      # Forecasts, anomaly alerts and reorder advice are computed from this
      # application's own recorded transactions, in Java, inside this service.
      #
      # There is deliberately no AI_PROVIDER_API_KEY here. Nothing reads one:
      # the models are implemented in com.inventory.backend.ai and evaluated by
      # backtesting on held-out history. A variable nothing reads is a variable
      # that eventually gets a real secret pasted into it and committed.
      #
      # Set AI_ENABLED to "false" to switch every /api/v1/ai endpoint off.
      # Reports, dashboards and financial figures keep working — they come from
      # the reporting layer, not from these models.
      - key: AI_ENABLED
        value: "true"
      - key: AI_HISTORY_DAYS
        value: "540"
      - key: AI_DEMAND_HISTORY_DAYS
        value: "365"
      - key: AI_CONFIDENCE
        value: "0.95"
      - key: AI_DAILY_HORIZON
        value: "14"
      - key: AI_MAX_DEMAND_MODELS
        value: "25"
      - key: AI_MIN_DEMAND_OBSERVATIONS
        value: "28"
      # A day is raised only when it is both statistically unusual and
      # materially different in money. See docs/intelligence.md.
      - key: AI_ANOMALY_THRESHOLD
        value: "3.5"
      - key: AI_ANOMALY_MIN_OBSERVATIONS
        value: "8"
      - key: AI_ANOMALY_MIN_RELATIVE_DEVIATION
        value: "0.30"
      - key: AI_LARGE_MOVEMENT_THRESHOLD
        value: "50"
      - key: AI_SLOW_MOVING_DAYS
        value: "60"
      - key: AI_DEFAULT_LEAD_TIME_DAYS
        value: "7"
      - key: AI_SERVICE_LEVEL
        value: "0.95"
      # Leave on. Turning this off means a figure already reported can no
      # longer be traced to the model and training period that produced it.
      - key: AI_PERSIST_MODEL_VERSIONS
        value: "true"
      - key: AI_ASSISTANT_MIN_CONFIDENCE
        value: "0.35"
      - key: REPORT_EXPORT_MAX_ROWS
        value: "10000"

      # ── Business assistant (docs/chatbot.md) ──────────────────────────────
      # Deterministic by default: the assistant answers from the same services
      # the reports use, and CHATBOT_PROVIDER=deterministic means no outbound
      # request is ever made. To let a model re-phrase already-validated tool
      # results, set CHATBOT_PROVIDER=openai-compatible in the dashboard and
      # add CHATBOT_API_KEY (or OPENAI_API_KEY) as a secret there — never in
      # this file. With CHATBOT_LLM_PHRASED=false the backend makes zero
      # outbound LLM requests even if a key is configured, and a configured
      # model is verified against the account at startup before it is used.
      - key: CHATBOT_ENABLED
        value: "true"
      - key: CHATBOT_PROVIDER
        value: deterministic
      - key: CHATBOT_API_URL
        value: https://api.openai.com/v1/chat/completions
      - key: CHATBOT_MODEL
        value: gpt-4o-mini
      - key: CHATBOT_LLM_PHRASED
        value: "true"
      - key: CHATBOT_TIMEOUT_MS
        value: "15000"
      - key: CHATBOT_MAX_TOKENS
        value: "900"
      - key: CHATBOT_MIN_CONFIDENCE
        value: "0.45"

      # ── Super-admin bootstrap (set real values in dashboard) ──────────────
      - key: SUPER_ADMIN_USERNAME
        value: superadmin
      - key: SUPER_ADMIN_EMAIL
        value: 12yemom@gmail.com
      - key: SUPER_ADMIN_PASSWORD
        generateValue: true   # generates a secure random password on first deploy (view in Render dashboard)
      - key: SUPER_ADMIN_FIRST_NAME
        value: Super
      - key: SUPER_ADMIN_LAST_NAME
        value: Admin

  # ── Next.js Frontend ──────────────────────────────────────────────────────
  - type: web
    name: stockflow-frontend
    runtime: docker
    region: oregon
    plan: free
    rootDir: frontend
    dockerfilePath: ./Dockerfile

    envVars:
      - key: NODE_ENV
        value: production
      - key: NEXT_PUBLIC_APP_NAME
        value: StockFlow
      # Set these to your actual Render service URLs after first deploy:
      - key: NEXT_PUBLIC_API_BASE_URL
        value: https://stockflow-backend.onrender.com/api/v1
      - key: NEXT_PUBLIC_APP_URL
        value: https://stockflow-frontend.onrender.com
      - key: API_INTERNAL_BASE_URL
        value: https://stockflow-backend.onrender.com/api/v1
