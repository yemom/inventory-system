# ── Tests always run against an ephemeral Testcontainers PostgreSQL ──────────
# IMPORTANT: integration tests MUST NOT be able to connect to a real database.
# The test profile uses ddl-auto=create-drop, so if it ever pointed at the
# development/production database, closing the context would DROP every table.
# That previously wiped the dev data; these two settings make it impossible.
spring.datasource.url=jdbc:tc:postgresql:15-alpine:///inventory_test_db
spring.datasource.driver-class-name=org.testcontainers.jdbc.ContainerDatabaseDriver
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

jwt.secret=testsecret94f6c46cb32145b0a7019f3900350d32b845187740e5dcbd41369d71c897f262
jwt.expiration=86400000
server.port=0

# Performance indexes are applied by PerformanceIndexInitializer; skip in tests.
app.performance-indexes.enabled=false

# Disable Redis for tests — the rate limiter and cache degrade gracefully.
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.password=
spring.data.redis.timeout=100ms
spring.data.redis.connect-timeout=100ms

# All tests share a single loopback IP, so per-IP limits would 429 each other.
rate-limit.enabled=false

app.super-admin.username=superadmin
app.super-admin.email=admin@stockflow.local
# Test-only value for the ephemeral Testcontainers database. StartupConfigValidator
# deliberately rejects the credentials that used to be committed to
# application.properties (see its placeholder denylist), so the old shared default
# cannot be reused here either — otherwise the test profile would be validating a
# password that is public knowledge in this repository.
app.super-admin.password=TestsOnly-7f3a91c4-SuperAdmin
app.super-admin.first-name=Super
app.super-admin.last-name=Admin