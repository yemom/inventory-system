spring.application.name=backend

# ── Database ────────────────────────────────────────────────
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5434/stockflow_db}
spring.datasource.username=${DATABASE_USERNAME:stockflow}
spring.datasource.password=${DATABASE_PASSWORD:stockflowpassword}
spring.datasource.driver-class-name=org.postgresql.Driver

# ── HikariCP connection pool (tuned for containerized deployment) ──
# With N API instances, total connections = N × maximum-pool-size.
# Keep this modest so PostgreSQL is not overwhelmed.
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX:10}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN:2}
spring.datasource.hikari.connection-timeout=10000
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=900000
spring.datasource.hikari.leak-detection-threshold=60000
spring.datasource.hikari.pool-name=StockFlowHikari
spring.datasource.hikari.initialization-fail-timeout=60000

# ── JPA / Hibernate ─────────────────────────────────────────
# The schema is owned by Hibernate (ddl-auto=update), which is what this
# project has always used. Performance indexes are applied *after* schema
# creation by PerformanceIndexInitializer (see config package) because they
# reference tables that only exist once Hibernate has created them.
#
# Do NOT enable Flyway here: baseline-on-migrate marks a fresh/empty schema
# as "baseline v1", which SKIPS migrations and leaves the database empty.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
# Disable Open Session In View so lazy loading is explicit in services and
# the transaction scope ends at the service boundary (removes the
# "queries may be performed during view rendering" warning + N+1 risk).
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.batch_size=25
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.default_batch_fetch_size=25

# ── Redis (rate limiting + cache) ───────────────────────────
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.timeout=2000ms
spring.data.redis.connect-timeout=2000ms
spring.data.redis.lettuce.pool.max-active=8
spring.data.redis.lettuce.pool.max-idle=4
spring.data.redis.lettuce.pool.min-idle=1

# ── JWT configuration ───────────────────────────────────────
jwt.secret=${JWT_SECRET:94f6c46cb32145b0a7019f3900350d32b845187740e5dcbd41369d71c897f262}
jwt.expiration=86400000

# ── Server ──────────────────────────────────────────────────
# Inside Docker Compose the backend listens on 8080 (published to the
# host as 8081). When run directly on the host, 8081 is used so it can be
# reached at the same URL the browser is configured with.
server.port=${SERVER_PORT:8081}
server.compression.enabled=true
server.compression.mime-types=application/json,application/xml,text/html,text/plain,text/css,application/javascript
server.compression.min-response-size=1024

# ── Actuator / Observability ────────────────────────────────
management.endpoints.web.exposure.include=health,metrics,prometheus
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never
management.metrics.export.prometheus.enabled=true
management.metrics.distribution.percentiles-histogram.http.server.requests=true

# ── Rate limiting (Redis-backed, distributed) ────────────────
rate-limit.enabled=${RATE_LIMIT_ENABLED:true}
rate-limit.login.capacity=${RATE_LIMIT_LOGIN:5}
rate-limit.login.window-seconds=${RATE_LIMIT_LOGIN_WINDOW:60}
rate-limit.signup.capacity=${RATE_LIMIT_SIGNUP:3}
rate-limit.signup.window-seconds=${RATE_LIMIT_SIGNUP_WINDOW:3600}
rate-limit.api.capacity=${RATE_LIMIT_API:120}
rate-limit.api.window-seconds=${RATE_LIMIT_API_WINDOW:60}
rate-limit.reports.capacity=${RATE_LIMIT_REPORTS:20}
rate-limit.reports.window-seconds=${RATE_LIMIT_REPORTS_WINDOW:60}

# ── Cache TTLs (seconds) ────────────────────────────────────
cache.category.ttl=${CACHE_CATEGORY_TTL:300}
cache.warehouse.ttl=${CACHE_WAREHOUSE_TTL:300}
cache.dashboard.ttl=${CACHE_DASHBOARD_TTL:30}
cache.product.ttl=${CACHE_PRODUCT_TTL:120}

