spring.application.name=backend
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5434/stockflow_db}
spring.datasource.username=${DATABASE_USERNAME:stockflow}
spring.datasource.password=${DATABASE_PASSWORD:stockflowpassword}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# JWT configuration
jwt.secret=${JWT_SECRET:94f6c46cb32145b0a7019f3900350d32b845187740e5dcbd41369d71c897f262}
jwt.expiration=86400000

# Inside Docker Compose the backend listens on 8080 (published to the
# host as 8081). When run directly on the host, 8081 is used so it can be
# reached at the same URL the browser is configured with.
server.port=${SERVER_PORT:8081}

# ── Actuator ───────────────────────────────────────────────
# `health` is the only endpoint exposed; it is also permitAll in
# SecurityConfig, so the container health check can use it.
management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never

# ── Database readiness ────────────────────────────────────
# Wait for PostgreSQL to accept connections rather than crash-looping
# when the database is still initialising.
spring.datasource.hikari.initialization-fail-timeout=60000
spring.datasource.hikari.connection-timeout=30000

