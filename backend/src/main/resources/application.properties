spring.application.name=backend

# ── Database ────────────────────────────────────────────────
# Two deployment modes are supported:
#
# 1. Local / Docker Compose:
#    Set DATABASE_URL to a full jdbc:postgresql://... URL.
#    DATABASE_USERNAME / DATABASE_PASSWORD for credentials.
#
# 2. Render.com (Blueprint / render.yaml):
#    Render exposes DB_HOST, DB_PORT, DB_NAME, DATABASE_USERNAME,
#    DATABASE_PASSWORD from the managed PostgreSQL service.
#    DATABASE_URL is assembled from those parts here.
#    SPRING_DATASOURCE_URL (Spring Boot's own env override) takes priority
#    if set directly in the Render dashboard.
#
# Managed platforms also expose DATABASE_URL as a *URI* rather than a JDBC
# URL, e.g. postgres://user:pw@host:5432/db. That is mapped straight into the
# property below, so DataSourceUrlEnvironmentPostProcessor rewrites it into a
# usable JDBC URL (and lifts any embedded credentials out of the URI) before
# the DataSource is created. Without it the driver rejects the URL, Hibernate
# finds no JDBC metadata and startup fails with "Unable to determine Dialect
# without JDBC metadata" even though a URL is clearly configured.
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5434}/${DB_NAME:stockflow_db}}
spring.datasource.username=${DATABASE_USERNAME:stockflow}
spring.datasource.password=${DATABASE_PASSWORD:stockflowpassword}
spring.datasource.driver-class-name=org.postgresql.Driver

# ── HikariCP connection pool (tuned for containerized deployment) ──
# With N API instances, total connections = N × maximum-pool-size.
# Keep this modest so PostgreSQL is not overwhelmed.
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX:10}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN:2}
spring.datasource.hikari.connection-timeout=10000
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=900000
spring.datasource.hikari.leak-detection-threshold=60000
spring.datasource.hikari.pool-name=StockFlowHikari
spring.datasource.hikari.initialization-fail-timeout=60000
# Driver-level timeouts (seconds), passed as connection properties so they apply
# no matter how the JDBC URL was assembled (including a platform-provided URI).
#
# Hikari's connection-timeout above only bounds waiting for a *pooled*
# connection. It does nothing once a connection is in hand: without a driver
# socketTimeout, a query sent to a database that has stopped responding (a
# suspended/expired managed instance still completes the TCP handshake, then
# never replies) blocks its request thread forever. Each hung request pins a
# thread until the pool is exhausted, after which every endpoint — including
# ones that need no database — stops responding. That is exactly how a wedged
# managed database presented as "the whole site is down".
#
# socketTimeout is therefore deliberately shorter than any legitimate query:
# the heaviest report is a few seconds.
spring.datasource.hikari.data-source-properties.connectTimeout=10
spring.datasource.hikari.data-source-properties.socketTimeout=30

# ── JPA / Hibernate ─────────────────────────────────────────
# The schema is owned by Hibernate (ddl-auto=update), which is what this
# project has always used. Performance indexes are applied *after* schema
# creation by PerformanceIndexInitializer (see config package) because they
# reference tables that only exist once Hibernate has created them.
#
# Do NOT enable Flyway here: baseline-on-migrate marks a fresh/empty schema
# as "baseline v1", which SKIPS migrations and leaves the database empty.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
# Disable Open Session In View so lazy loading is explicit in services and
# the transaction scope ends at the service boundary (removes the
# "queries may be performed during view rendering" warning + N+1 risk).
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.batch_size=25
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.default_batch_fetch_size=25

# ── Redis (rate limiting + cache) ───────────────────────────
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.timeout=2000ms
spring.data.redis.connect-timeout=2000ms
spring.data.redis.lettuce.pool.max-active=8
spring.data.redis.lettuce.pool.max-idle=4
spring.data.redis.lettuce.pool.min-idle=1

# ── JWT configuration ───────────────────────────────────────
# REQUIRED — there is deliberately no fallback value. A JWT signing key that
# ships in the repository is a publicly known key: anyone can mint a token with
# SUPER_ADMIN claims and take over every account. StartupConfigValidator refuses
# to boot when this is missing or too short, pointing at `openssl rand -hex 32`.
jwt.secret=${JWT_SECRET:}
jwt.expiration=86400000

# ── Server ──────────────────────────────────────────────────
# Inside Docker Compose the backend listens on 8080 (published to the
# host as 8081). When run directly on the host, 8081 is used so it can be
# reached at the same URL the browser is configured with.
server.port=${SERVER_PORT:8081}
server.compression.enabled=true
server.compression.mime-types=application/json,application/xml,text/html,text/plain,text/css,application/javascript
server.compression.min-response-size=1024

# ── Actuator / Observability ────────────────────────────────
management.endpoints.web.exposure.include=health,metrics,prometheus
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never
# Boot's auto-configured Redis health indicator is replaced by
# RedisHealthIndicator (health component "redis"). Redis is optional here: the
# rate limiter and cache both fail open, so reporting DOWN for an unreachable
# Redis would take a perfectly working instance out of rotation and 503 every
# request. See that class for the reasoning.
management.health.redis.enabled=false
management.metrics.export.prometheus.enabled=true
management.metrics.distribution.percentiles-histogram.http.server.requests=true

# ── CORS ────────────────────────────────────────────────────
# Comma-separated browser origins allowed to call this API, on top of the
# localhost/LAN patterns that SecurityConfig always allows for development.
#
# REQUIRED in production: without it every API call from the deployed frontend is
# blocked by the browser at the preflight, which surfaces as an opaque network
# error ("Failed to fetch") rather than a CORS message.
#
# Use exact origins. A wildcard such as https://*.vercel.app would let ANY
# Vercel deployment make credentialed (allowCredentials=true) calls to this API,
# so preview deployments must be listed explicitly instead.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:}

# ── Rate limiting (Redis-backed, distributed) ────────────────
rate-limit.enabled=${RATE_LIMIT_ENABLED:true}
rate-limit.login.capacity=${RATE_LIMIT_LOGIN:5}
rate-limit.login.window-seconds=${RATE_LIMIT_LOGIN_WINDOW:60}
rate-limit.signup.capacity=${RATE_LIMIT_SIGNUP:3}
rate-limit.signup.window-seconds=${RATE_LIMIT_SIGNUP_WINDOW:3600}
rate-limit.api.capacity=${RATE_LIMIT_API:120}
rate-limit.api.window-seconds=${RATE_LIMIT_API_WINDOW:60}
rate-limit.reports.capacity=${RATE_LIMIT_REPORTS:20}
rate-limit.reports.window-seconds=${RATE_LIMIT_REPORTS_WINDOW:60}

# ── Cache TTLs (seconds) ────────────────────────────────────
cache.category.ttl=${CACHE_CATEGORY_TTL:300}
cache.warehouse.ttl=${CACHE_WAREHOUSE_TTL:300}
cache.dashboard.ttl=${CACHE_DASHBOARD_TTL:30}
cache.product.ttl=${CACHE_PRODUCT_TTL:120}

# ── Super-admin bootstrap ───────────────────────────────────
# SUPER_ADMIN_PASSWORD is REQUIRED and has no fallback, for the same reason as
# jwt.secret: a seeded administrator credential committed to the repository is
# a working backdoor into a freshly deployed instance. StartupConfigValidator
# refuses to boot when it is missing or shorter than 12 characters.
app.super-admin.username=${SUPER_ADMIN_USERNAME:superadmin}
app.super-admin.email=${SUPER_ADMIN_EMAIL:admin@stockflow.local}
app.super-admin.password=${SUPER_ADMIN_PASSWORD:}
app.super-admin.first-name=${SUPER_ADMIN_FIRST_NAME:Super}
app.super-admin.last-name=${SUPER_ADMIN_LAST_NAME:Admin}

# ── Intelligence service (forecast, anomaly, inventory advice, assistant) ───
# Everything here is computed from this application's own recorded transactions.
# There is no external AI provider, no API key and no outbound call: the models
# are implemented in com.inventory.backend.ai and evaluated by backtesting on
# held-out history. Turning AI_ENABLED off disables every /api/v1/ai endpoint
# without affecting the reports, which continue to serve validated figures.
app.ai.enabled=${AI_ENABLED:true}
app.ai.history-days=${AI_HISTORY_DAYS:540}
app.ai.demand-history-days=${AI_DEMAND_HISTORY_DAYS:365}
app.ai.confidence=${AI_CONFIDENCE:0.95}
app.ai.default-daily-horizon=${AI_DAILY_HORIZON:14}
app.ai.max-demand-models=${AI_MAX_DEMAND_MODELS:25}
app.ai.minimum-demand-observations=${AI_MIN_DEMAND_OBSERVATIONS:28}
app.ai.anomaly-threshold=${AI_ANOMALY_THRESHOLD:3.5}
app.ai.anomaly-minimum-observations=${AI_ANOMALY_MIN_OBSERVATIONS:8}
# A day must also be worth someone's attention in money, not merely improbable.
# A small business has a small spread, so ordinary variation scores high on a
# robust z-score; without this floor the alerts panel fills with Tuesdays.
app.ai.anomaly-minimum-relative-deviation=${AI_ANOMALY_MIN_RELATIVE_DEVIATION:0.30}
app.ai.large-movement-threshold=${AI_LARGE_MOVEMENT_THRESHOLD:50}
app.ai.slow-moving-days=${AI_SLOW_MOVING_DAYS:60}
app.ai.default-lead-time-days=${AI_DEFAULT_LEAD_TIME_DAYS:7}
app.ai.service-level=${AI_SERVICE_LEVEL:0.95}
app.ai.persist-model-versions=${AI_PERSIST_MODEL_VERSIONS:true}
# Below this confidence the assistant asks which report was meant rather than
# answering a question it has only partly understood.
app.ai.assistant-min-confidence=${AI_ASSISTANT_MIN_CONFIDENCE:0.35}

# ── Chatbot ─────────────────────────────────────────────────────────
# The chatbot answers from the same services the reports use, so its
# figures are the reports' figures. A language model may be plugged in
# through a configurable provider to re-word those answers, but it can
# never supply them: every number in a phrased answer is checked against
# the tool results, and a number the tools did not return is discarded.
#
# CHATBOT_PROVIDER: "deterministic" (default; no network, no key) or
# "openai-compatible" (calls CHATBOT_API_URL with CHATBOT_API_KEY).
# The key is read from the environment only, is never logged and never
# returned by any endpoint.
app.chatbot.enabled=${CHATBOT_ENABLED:true}
app.chatbot.provider=${CHATBOT_PROVIDER:deterministic}
# The full chat-completions endpoint, or a base URL the suffix is appended to.
# Both https://api.openai.com/v1/chat/completions and https://api.openai.com/v1 work.
app.chatbot.api-url=${CHATBOT_API_URL:}
# The server-side secret, bound under both names. An empty value falls
# through to the next name (ChatbotProperties.getApiKey), because a nested
# ${CHATBOT_API_KEY:${OPENAI_API_KEY:}} resolves to an empty string when the
# first name is present-but-empty — which is what every ${VAR:-} pass-through
# supplies — and never reaches its own fallback. With neither set the
# assistant is deterministic and makes no outbound request.
# Never logged, never returned, never in the frontend.
app.chatbot.api-key=${CHATBOT_API_KEY:}
app.chatbot.openai-api-key=${OPENAI_API_KEY:}
app.chatbot.model=${CHATBOT_MODEL:gpt-4o-mini}
# A hung provider must never hang the chatbot: the deterministic answer
# is always available as the fallback, so the timeout is short.
app.chatbot.timeout-ms=${CHATBOT_TIMEOUT_MS:15000}
app.chatbot.max-tokens=${CHATBOT_MAX_TOKENS:900}
# Set false to guarantee no outbound call is ever made.
app.chatbot.llm-phrasing-allowed=${CHATBOT_LLM_PHRASED:true}
# The phrasing layer is shown at most this much tool output.
app.chatbot.max-context-chars=${CHATBOT_MAX_CONTEXT_CHARS:6000}
# How long a question must be understood before it is answered rather
# than clarified. The classifier's confidence is the best intent's
# score over the total, so two intents that tie read as ambiguous.
app.chatbot.assistant-min-confidence=${CHATBOT_MIN_CONFIDENCE:0.45}
# Retention: a customer asking about an order is not asking to be
# remembered, so customer conversations expire sooner than staff ones.
app.chatbot.staff-retention-days=${CHATBOT_STAFF_RETENTION_DAYS:90}
app.chatbot.customer-retention-days=${CHATBOT_CUSTOMER_RETENTION_DAYS:30}
# A customer session token's lifetime. Long enough to finish a
# conversation, short enough to stop working on a shared computer.
app.chatbot.session-ttl-hours=${CHATBOT_SESSION_TTL_HOURS:12}
# A conversation stops growing here. Older messages are dropped, which
# also bounds what a provider is ever shown.
app.chatbot.max-messages-per-conversation=${CHATBOT_MAX_MESSAGES:100}
# Per-actor rate limit, counted independently of the API budget.
app.chatbot.messages-per-window=${CHATBOT_MESSAGES_PER_WINDOW:30}
app.chatbot.window-seconds=${CHATBOT_WINDOW_SECONDS:60}

# ── Report exports ──────────────────────────────────────────────────────────
# Exports are rendered server-side from the same endpoint that serves the screen,
# so an exported file can never contain a figure the screen did not show. Both
# renderers build the whole file in memory on the request thread, so the row
# count is capped: a report matching more than this is REFUSED with an
# instruction to narrow the range, never silently truncated. A truncated export
# that looks complete is worse than none, because a reader would total it.
app.report.export-max-rows=${REPORT_EXPORT_MAX_ROWS:10000}
