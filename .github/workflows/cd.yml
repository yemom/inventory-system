name: CD

on:
  push:
    tags:
      - 'v*.*.*'
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        default: staging
        type: choice
        options: [staging, production]

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository_owner }}

jobs:
  # ─────────────────────────────────────────────────────────────────────────
  # Build once, tag many ways, push to both GHCR and Docker Hub.
  # ─────────────────────────────────────────────────────────────────────────
  publish:
    name: Build & publish images
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'workflow_dispatch' || vars.ENABLE_GHCR == 'true'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        if: vars.DOCKERHUB_USERNAME != ''
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Compute image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/backend
            ${{ env.IMAGE_PREFIX }}/backend
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/frontend
            ${{ env.IMAGE_PREFIX }}/frontend
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      # ── Backend ────────────────────────────────────────────────────────────
      - name: Build & push backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/backend:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/backend:${{ github.sha }}
            ${{ env.IMAGE_PREFIX }}/backend:latest
            ${{ env.IMAGE_PREFIX }}/backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ── Frontend ──────────────────────────────────────────────────────────
      - name: Build & push frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/frontend:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/frontend:${{ github.sha }}
            ${{ env.IMAGE_PREFIX }}/frontend:latest
            ${{ env.IMAGE_PREFIX }}/frontend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Record deployment
        run: |
          {
            echo "### Images published"
            echo ""
            echo "- \`backend\` → \`${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/backend:${{ github.sha }}\`"
            echo "- \`frontend\` → \`${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/frontend:${{ github.sha }}\`"
            echo "- Commit: ${{ github.sha }}"
          } >> "$GITHUB_STEP_SUMMARY"

  # ─────────────────────────────────────────────────────────────────────────
  # Deploy to a remote host over SSH (self-hosted / VPS / EC2).
  # Skipped automatically when DEPLOY_HOST is not configured.
  # ─────────────────────────────────────────────────────────────────────────
  deploy:
    name: Deploy over SSH
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: publish
    environment: ${{ inputs.environment || 'staging' }}
    # Only run when a host is configured; otherwise this job would fail on forks.
    if: vars.DEPLOY_HOST != '' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v'))

    steps:
      - uses: actions/checkout@v4

      - name: Configure SSH
        env:
          DEPLOY_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          echo "${{ vars.DEPLOY_HOST }}" > ~/.ssh/known_hosts

      - name: Deploy (docker compose pull + up)
        env:
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH || '/opt/stockflow' }}
          SHA: ${{ github.sha }}
          IMAGE_REPO: ${{ vars.IMAGE_REPO || format('ghcr.io/{0}', github.repository_owner) }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/id_ed25519 "root@$DEPLOY_HOST" bash -s <<EOF
          set -euo pipefail
          cd "$DEPLOY_PATH"

          # Keep secrets local to the server — never in git.
          test -f .env || { echo "Missing .env on $DEPLOY_PATH"; exit 1; }

          docker compose pull
          BACKEND_IMAGE="$IMAGE_REPO/backend:$SHA" \\
          FRONTEND_IMAGE="$IMAGE_REPO/frontend:$SHA" \\
            docker compose up -d --remove-orphans

          echo "Waiting for health..."
          for i in \$(seq 1 30); do
            if curl -fsS http://localhost:8081/actuator/health >/dev/null 2>&1; then
              echo "Deployed and healthy"
              docker compose ps
              exit 0
            fi
            sleep 5
          done

          echo "Health check failed — recent logs:"
          docker compose logs --tail 100 backend
          exit 1
          EOF

      - name: Notify
        if: always()
        run: |
          {
            echo "### Deployment"
            echo ""
            echo "- Result: ${{ job.status }}"
            echo "- Commit: ${{ github.sha }}"
          } >> "$GITHUB_STEP_SUMMARY"