# Continuous integration for StockFlow.
#
# Two independent jobs, neither of which needs production credentials:
#
#   backend  — compiles, runs the full unit + integration suite. The integration
#              tests start a throwaway PostgreSQL through Testcontainers, so this
#              job needs no secrets and never touches a real database.
#   frontend — type-check, lint, unit tests and a production build.
#
# Docker builds are validated separately from the Java build because the images
# already build the same sources on every push; `docker` below is a smoke build
# of the backend image only, which is the one whose Dockerfile can fail on a
# stale layer or a bad JAR glob.

name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

# A new push supersedes an in-flight run of the same branch.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend — compile and test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Compile
        run: mvn -B -q clean compile

      # Testcontainers provisions its own PostgreSQL; no service container and no
      # repository credentials are required for this to run on a pull request.
      - name: Test
        run: mvn -B clean test

  frontend:
    name: Frontend — types, lint, tests, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Type-check
        run: npm run type-check

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npx jest --ci

      - name: Production build
        run: npm run build
        env:
          # The client reads this at build time. CI needs no real backend: the
          # build only inlines the value, it never calls it.
          NEXT_PUBLIC_API_BASE_URL: http://localhost:8081/api/v1

  docker:
    name: Docker — backend image builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build backend image
        run: docker build -t stockflow-backend:ci backend

      - name: Build frontend image
        run: docker build -t stockflow-frontend:ci frontend